# Nureke — сайт студии и CRM.
# См. docs/decisions/0002-platform-architecture.md

services:
  postgres:
    image: postgres:16-alpine
    container_name: nureke-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD керек}
    volumes:
      - nureke_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nureke-web
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      DATABASE_URL: "postgresql://studio:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD керек}@postgres:5432/studio?schema=public"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://nureke.kz}
      NEXT_PUBLIC_PHONE: ${NEXT_PUBLIC_PHONE:-}
      NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}
      NEXT_PUBLIC_TELEGRAM: ${NEXT_PUBLIC_TELEGRAM:-}
      NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  nureke_postgres_data:
